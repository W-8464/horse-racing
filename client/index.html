<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Horse Racing">

    <link rel="manifest" href="manifest.json">

    <title>Horse Racing</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        * {
            /* Tắt menu hệ thống khi nhấn giữ */
            -webkit-touch-callout: none !important;

            /* Tắt khả năng bôi đen văn bản */
            -webkit-user-select: none !important;
            user-select: none !important;

            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;
        }

        *:not(input) {
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
        }

        /* 4. CSS để khóa màn hình tuyệt đối */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Chặn cuộn trang */
            position: fixed;
            /* Cố định vị trí để tránh trượt trên iOS */
            background: #222;
            touch-action: none;
            -ms-touch-action: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100vw;
            height: 100dvh;
            /* ✅ mobile */
            overflow: hidden;
        }

        /* 5. Ép input không bao giờ gây zoom */
        input {
            font-size: 16px !important;
        }

        canvas {
            touch-action: none !important;
            -ms-touch-action: none !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            user-select: none !important;
            /* Loại bỏ highlight màu xanh khi tap trên Android/Zalo */
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
            outline: none !important;
        }

        #version-tag {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.5);
            /* Màu trắng mờ để không gây xao nhãng */
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 100;
            /* Đảm bảo luôn nằm trên cùng của game */
            pointer-events: none;
            /* Giúp người dùng click xuyên qua thẻ này để tương tác với game */
            user-select: none;
        }

        #rotate-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            display: none;

            justify-content: center;
            align-items: center;

            pointer-events: all;
            /* chặn toàn bộ thao tác */
        }

        #rotate-overlay.active {
            display: flex;
        }

        .rotate-box {
            color: #fff;
            font-size: 20px;
            text-align: center;
            line-height: 1.6;
            padding: 20px 28px;
            border: 2px solid #fff;
            border-radius: 12px;
        }

        #game-container,
        canvas {
            /* Quan trọng cho Android Chrome */
            touch-action: none !important;

            /* Các thuộc tính cũ giữ nguyên */
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            outline: none !important;
        }
    </style>
</head>

<body>
    <div id="game-container"></div>
    <div id="version-tag">v2.9.2</div>
    <script>
        window.isInputActive = false;
        let lastTouchEnd = 0;

        // --- 1. CHẶN GESTURE CỦA APPLE (Menu 3 ngón, Zoom) ---
        // Sự kiện này luôn cần chặn triệt để
        const preventGesture = (e) => {
            if (e.cancelable) e.preventDefault();
            e.stopImmediatePropagation();
        };

        document.addEventListener('gesturestart', preventGesture, { passive: false, capture: true });
        document.addEventListener('gesturechange', preventGesture, { passive: false, capture: true });
        document.addEventListener('gestureend', preventGesture, { passive: false, capture: true });

        document.addEventListener('touchstart', function (e) {
            const selection = window.getSelection();
            if (selection && selection.rangeCount > 0) selection.removeAllRanges();

            const isInput = e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON';

            // Nếu đang nhập liệu thì thả cho đi
            if (window.isInputActive && isInput) return;

            // --- SỬA ĐỔI TẠI ĐÂY ---
            if (e.touches.length > 1) {
                // Nếu có hơn 1 ngón tay, chặn NGAY LẬP TỨC
                if (e.cancelable) e.preventDefault();

                // Chặn sự kiện lan xuống Phaser, bất kể là Canvas hay không
                // Điều này khiến Phaser chỉ nhìn thấy ngón tay đầu tiên
                e.stopImmediatePropagation();
            }
            // ------------------------
            else {
                // Logic cho 1 ngón tay giữ nguyên
                const isCanvas = e.target.tagName === 'CANVAS';
                if (!isCanvas) {
                    if (e.cancelable) e.preventDefault();
                }
            }
        }, { passive: false, capture: true });

        // --- 3. XỬ LÝ TOUCHEND ---
        document.addEventListener('touchend', function (e) {
            // Chặn hành vi nhấc tay khi đang có nhiều ngón (tránh menu hiện lúc này)
            if (e.touches.length > 0 || e.changedTouches.length > 1) {
                if (e.cancelable) e.preventDefault();
            }

            if (window.isInputActive) {
                lastTouchEnd = Date.now();
                return;
            }

            // Chặn Double Tap Zoom
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                if (e.cancelable) e.preventDefault();
            }
            lastTouchEnd = now;

            const selection = window.getSelection();
            if (selection && selection.rangeCount > 0) selection.removeAllRanges();
        }, { passive: false });

        document.addEventListener('touchmove', function (e) {
            // 1. Ưu tiên cao nhất: Nếu là đa điểm -> CHẶN TUYỆT ĐỐI (cho Android)
            if (e.touches.length > 1) {
                if (e.cancelable) e.preventDefault();
                return; // Dừng luôn, không quan tâm input active hay không
            }

            // 2. Nếu đang nhập liệu 1 ngón -> Cho phép (để scroll text input)
            if (window.isInputActive) return;

            // 3. Còn lại -> Chặn (để không kéo trang web)
            if (e.cancelable) e.preventDefault();
        }, { passive: false });

        document.addEventListener('contextmenu', function (e) {
            if (!window.isInputActive) {
                if (e.cancelable) e.preventDefault();
                e.stopImmediatePropagation();
            }
        }, { passive: false });

        // Focus lock
        window.addEventListener('focusin', function (e) {
            if (!window.isInputActive && e.target.tagName !== 'CANVAS' && e.target.tagName !== 'INPUT') {
                e.target.blur();
                window.focus();
            }
        });
    </script>
    <script type="module" src="src/main.js"></script>
</body>

</html>
