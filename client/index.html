<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Horse Racing">

    <link rel="manifest" href="manifest.json">

    <title>Horse Racing</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        * {
            /* Tắt menu hệ thống khi nhấn giữ */
            -webkit-touch-callout: none !important;

            /* Tắt khả năng bôi đen văn bản */
            -webkit-user-select: none !important;
            user-select: none !important;

            /* Tắt highlight màu khi tap */
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
        }

        *:not(input) {
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
        }

        /* 4. CSS để khóa màn hình tuyệt đối */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* Chặn cuộn trang */
            position: fixed;
            /* Cố định vị trí để tránh trượt trên iOS */
            background: #222;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100vw;
            height: 100dvh;
            /* ✅ mobile */
            overflow: hidden;
        }

        /* 5. Ép input không bao giờ gây zoom */
        input {
            font-size: 16px !important;
        }

        canvas {
            touch-action: none !important;
            -ms-touch-action: none !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            user-select: none !important;
            /* Loại bỏ highlight màu xanh khi tap trên Android/Zalo */
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
            outline: none !important;
        }

        #version-tag {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.5);
            /* Màu trắng mờ để không gây xao nhãng */
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 100;
            /* Đảm bảo luôn nằm trên cùng của game */
            pointer-events: none;
            /* Giúp người dùng click xuyên qua thẻ này để tương tác với game */
            user-select: none;
        }

        #rotate-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            display: none;

            justify-content: center;
            align-items: center;

            pointer-events: all;
            /* chặn toàn bộ thao tác */
        }

        #rotate-overlay.active {
            display: flex;
        }

        .rotate-box {
            color: #fff;
            font-size: 20px;
            text-align: center;
            line-height: 1.6;
            padding: 20px 28px;
            border: 2px solid #fff;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div id="game-container"></div>
    <div id="version-tag">v2.6</div>
    <script>
        // --- BIẾN TOÀN CỤC: CỜ BẬT/TẮT CHẾ ĐỘ NHẬP LIỆU ---
        // false: Đang chơi game (Chặn hết)
        // true: Đang nhập tên/pass (Cho phép gõ)
        window.isInputActive = false;

        let lastTouchEnd = 0;

        function preventDefault(e) {
            if (e.cancelable) e.preventDefault();
        }

        // 1. CHẶN BÔI ĐEN
        document.addEventListener('selectstart', function (e) {
            // Nếu đang ở chế độ nhập liệu và target là input -> Cho phép
            if (window.isInputActive && e.target.tagName === 'INPUT') return;
            preventDefault(e);
        });

        document.addEventListener('selectionchange', function () {
            // Nếu đang chơi game mà lại có selection -> Xóa ngay
            if (!window.isInputActive) {
                const selection = window.getSelection();
                if (selection && selection.rangeCount > 0) selection.removeAllRanges();
            }
        });

        // 2. CHẶN GESTURE (ZOOM, 3 NGÓN) - Luôn chặn để tránh zoom trang
        document.addEventListener('gesturestart', preventDefault, { passive: false });
        document.addEventListener('gesturechange', preventDefault, { passive: false });
        document.addEventListener('gestureend', preventDefault, { passive: false });

        // 3. CHẶN MENU CHUỘT PHẢI
        document.addEventListener('contextmenu', function (e) {
            if (window.isInputActive && e.target.tagName === 'INPUT') return;
            preventDefault(e);
        });

        // 4. CHẶN KÉO TRANG (TOUCHMOVE)
        document.addEventListener('touchmove', function (e) {
            // Luôn chặn kéo trang để cố định màn hình game
            if (e.cancelable) e.preventDefault();
        }, { passive: false });

        // 5. XỬ LÝ DOUBLE TAP & TOUCH END
        document.addEventListener('touchend', function (e) {
            // Nếu đang nhập liệu thì không can thiệp (để người dùng tap vào ô input/nút bấm)
            if (window.isInputActive) {
                lastTouchEnd = (new Date()).getTime();
                return;
            }

            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;

            // Dọn dẹp selection thừa khi nhấc tay
            const selection = window.getSelection();
            if (selection && selection.rangeCount > 0) selection.removeAllRanges();
        }, { passive: false });

        // 6. CHỐT CHẶN: QUẢN LÝ FOCUS
        window.addEventListener('focusin', function (e) {
            // Nếu ĐANG CHƠI GAME (isInputActive = false) mà có cái gì đó không phải Canvas được focus
            // -> Blur ngay lập tức (Chặn bàn phím/toolbar hiện lên lung tung)
            if (!window.isInputActive && e.target.tagName !== 'CANVAS') {
                e.target.blur();
                window.focus();
            }
        });
    </script>
    <script type="module" src="src/main.js"></script>
</body>

</html>
