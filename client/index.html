<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Horse Racing">

    <link rel="manifest" href="manifest.json">

    <title>Horse Racing</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        * {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;
        }

        *:not(input) {
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #222;
            touch-action: none;
            -ms-touch-action: none;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            /* Quan trọng cho Android Chrome: Báo hiệu không xử lý gesture */
            touch-action: none !important;
        }

        input {
            font-size: 16px !important;
        }

        canvas {
            touch-action: none !important;
            -ms-touch-action: none !important;
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            user-select: none !important;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0) !important;
            outline: none !important;
        }

        #version-tag {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            user-select: none;
        }

        #rotate-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: all;
        }

        #rotate-overlay.active {
            display: flex;
        }

        .rotate-box {
            color: #fff;
            font-size: 20px;
            text-align: center;
            line-height: 1.6;
            padding: 20px 28px;
            border: 2px solid #fff;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div id="game-container"></div>
    <div id="version-tag">v2.9.4</div>
    <script>
        window.isInputActive = false;
        let lastTouchEnd = 0;

        // --- 1. CHẶN GESTURE CỦA APPLE (Menu 3 ngón, Zoom) ---
        const preventGesture = (e) => {
            if (e.cancelable) e.preventDefault();
            e.stopImmediatePropagation();
        };

        document.addEventListener('gesturestart', preventGesture, { passive: false, capture: true });
        document.addEventListener('gesturechange', preventGesture, { passive: false, capture: true });
        document.addEventListener('gestureend', preventGesture, { passive: false, capture: true });

        // --- 2. [MỚI] CHẶN POINTER EVENTS (QUAN TRỌNG CHO ANDROID) ---
        document.addEventListener('pointerdown', function (e) {
            const tag = e.target.tagName;
            if (tag === 'INPUT' || tag === 'BUTTON' || tag === 'SELECT') return;

            if (window.isInputActive) return;

            if (e.pointerType === 'touch' && !e.isPrimary) {
                if (e.cancelable) e.preventDefault();
                e.stopImmediatePropagation();
            }
        }, { capture: true, passive: false });


        // --- 3. XỬ LÝ TOUCHSTART ---
        document.addEventListener('touchstart', function (e) {
            const selection = window.getSelection();
            if (selection && selection.rangeCount > 0) selection.removeAllRanges();

            const tag = e.target.tagName;

            if (tag === 'INPUT' || tag === 'BUTTON' || tag === 'SELECT' || tag === 'TEXTAREA') {
                return;
            }

            if (window.isInputActive) return;

            if (e.targetTouches.length > 1) {
                if (e.cancelable) e.preventDefault();
                e.stopImmediatePropagation();
                return;
            }
            else {
                const isCanvas = e.target.tagName === 'CANVAS';
                if (!isCanvas) {
                    if (e.cancelable) e.preventDefault();
                }
            }
        }, { passive: false, capture: true });

        // --- 4. XỬ LÝ TOUCHMOVE ---
        document.addEventListener('touchmove', function (e) {
            if (e.targetTouches.length > 1) {
                if (e.cancelable) e.preventDefault();
                return;
            }

            if (window.isInputActive) return;

            if (e.cancelable) e.preventDefault();
        }, { passive: false });

        // --- 5. XỬ LÝ TOUCHEND ---
        document.addEventListener('touchend', function (e) {
            // Nếu vẫn còn ngón tay khác trên màn hình -> Chặn hành vi mặc định
            if (e.touches.length > 0 || e.changedTouches.length > 1) {
                if (e.cancelable) e.preventDefault();
            }

            const tag = e.target.tagName;
            if (tag === 'BUTTON' || tag === 'INPUT') {
                return;
            }

            if (window.isInputActive) {
                lastTouchEnd = Date.now();
                return;
            }

            // Chặn Double Tap Zoom
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                if (e.cancelable) e.preventDefault();
            }
            lastTouchEnd = now;

            const selection = window.getSelection();
            if (selection && selection.rangeCount > 0) selection.removeAllRanges();
        }, { passive: false });

        document.addEventListener('contextmenu', function (e) {
            if (!window.isInputActive) {
                if (e.cancelable) e.preventDefault();
                e.stopImmediatePropagation();
            }
        }, { passive: false });

        window.addEventListener('focusin', function (e) {
            if (!window.isInputActive && e.target.tagName !== 'CANVAS' && e.target.tagName !== 'INPUT') {
                e.target.blur();
                window.focus();
            }
        });
    </script>
    <script type="module" src="src/main.js"></script>
</body>

</html>
