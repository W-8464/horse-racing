<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Horse Racing">

    <link rel="manifest" href="manifest.json">

    <title>Horse Racing</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        * {
            -webkit-touch-callout: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-user-drag: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Thêm touch-action: none vào body và canvas để trình duyệt Android hiểu ngay từ đầu */
        html,
        body,
        canvas,
        #game-container {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #222;
            touch-action: none !important;
            /* QUAN TRỌNG CHO ANDROID */
            -ms-touch-action: none !important;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CSS input giữ nguyên */
        input {
            font-size: 16px !important;
            user-select: text !important;
            /* Cho phép chọn text trong input */
            -webkit-user-select: text !important;
        }

        #version-tag {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-family: Arial, sans-serif;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
        }

        #rotate-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            pointer-events: all;
        }

        #rotate-overlay.active {
            display: flex;
        }

        .rotate-box {
            color: #fff;
            font-size: 20px;
            text-align: center;
            line-height: 1.6;
            padding: 20px 28px;
            border: 2px solid #fff;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div id="game-container"></div>
    <div id="version-tag">v2.9.2</div>
    <script>
        window.isInputActive = false;
        let lastTouchEnd = 0;

        // --- 1. CHẶN GESTURE CỦA APPLE (Giữ nguyên vì tốt cho iOS) ---
        const preventGesture = (e) => {
            if (e.cancelable) e.preventDefault();
            e.stopImmediatePropagation();
        };
        document.addEventListener('gesturestart', preventGesture, { passive: false, capture: true });
        document.addEventListener('gesturechange', preventGesture, { passive: false, capture: true });
        document.addEventListener('gestureend', preventGesture, { passive: false, capture: true });

        // --- 2. XỬ LÝ TOUCHSTART (SỬA ĐỔI CHO ANDROID) ---
        document.addEventListener('touchstart', function (e) {
            const isInput = e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON';

            if (window.isInputActive && isInput) return;

            // [LOGIC MỚI] Chặn triệt để Multitouch trên mọi thiết bị
            if (e.touches.length > 1) {
                // Nếu có hơn 1 ngón tay chạm vào
                if (e.cancelable) e.preventDefault();

                // QUAN TRỌNG: Xóa bỏ điều kiện (!isCanvas)
                // Stop ngay lập tức để Phaser/Game KHÔNG nhận được ngón thứ 2, 3...
                e.stopImmediatePropagation();
                return;
            }

            // Nếu chỉ 1 ngón tay (Single Touch)
            if (e.target.tagName !== 'CANVAS') {
                // Nếu chạm ra ngoài game (body đen) thì chặn scroll
                if (e.cancelable) e.preventDefault();
            }
        }, { passive: false, capture: true });

        // --- 3. XỬ LÝ TOUCHMOVE (Bổ sung chặn Multitouch khi di chuyển) ---
        document.addEventListener('touchmove', function (e) {
            if (window.isInputActive) return;

            // Nếu đang di chuyển nhiều hơn 1 ngón -> Chặn hết
            if (e.touches.length > 1) {
                if (e.cancelable) e.preventDefault();
                e.stopImmediatePropagation();
                return;
            }

            // Mặc định chặn scroll trang web
            if (e.cancelable) e.preventDefault();
        }, { passive: false, capture: true });

        // --- 4. TOUCHEND & CÁC SỰ KIỆN KHÁC ---
        document.addEventListener('touchend', function (e) {
            // Chặn hành vi nhấc tay khi đang có nhiều ngón
            if (e.touches.length > 0 || e.changedTouches.length > 1) {
                // Logic cũ của bạn ok, nhưng thêm stopPropagation cho chắc
                if (e.cancelable) e.preventDefault();
                e.stopImmediatePropagation();
            }

            if (window.isInputActive) {
                lastTouchEnd = Date.now();
                return;
            }

            // Chặn Double Tap Zoom
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                if (e.cancelable) e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false, capture: true }); // Thêm capture: true để bắt sự kiện sớm nhất

        document.addEventListener('contextmenu', function (e) {
            if (!window.isInputActive) {
                if (e.cancelable) e.preventDefault();
                e.stopImmediatePropagation();
            }
        }, { passive: false });

        window.addEventListener('focusin', function (e) {
            if (!window.isInputActive && e.target.tagName !== 'CANVAS' && e.target.tagName !== 'INPUT') {
                e.target.blur();
                window.focus();
            }
        });
    </script>
    <script type="module" src="src/main.js"></script>
</body>

</html>
